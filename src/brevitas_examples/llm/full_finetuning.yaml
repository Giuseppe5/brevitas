model: meta-llama/Llama-3.2-1B
dataset: fineweb
custom_trainer: custom_trainer.py:full_finetune
nsamples_rot_calibration: 1000000
max_steps: 100
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
bf16: True
use_distillation_loss: True
gamma: 0.
logging_steps: 10
warmup_steps: 10
input_bit_width: 4
input_scale_type: dynamic
input_quant_format: float_ocp_e2m1
input_quant_type: sym
input_scale_precision: po2_scale
input_quant_granularity: per_group
input_group_size: 32
weight_bit_width: 4
weight_quant_format: float_ocp_e2m1
weight_quant_type: sym
weight_scale_precision: po2_scale
weight_quant_granularity: per_group
weight_group_size: 32
eval: true
few_shot_eval: lighteval
few_shot_limit: null
few_shot_override_batch_size: 32
few_shot_tasks:
- arc:challenge|0
- winogrande|0
- arc:easy|0
- hellaswag_lm_eval|0
few_shot_zeroshot: true

